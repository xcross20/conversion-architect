# Railway deployment configuration
# https://docs.railway.com/reference/config-as-code

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "exec python -m uvicorn conversion_architect.api.main:app --host 0.0.0.0 --port ${PORT:-8080} --workers 1 --log-level info --proxy-headers --forwarded-allow-ips='*'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10